name: Build ts6-manager-coom images

on:
  workflow_dispatch:
    inputs:
      fork_ref:
        description: coom/ts6-manager git ref to build
        required: true
        default: 09573b64cadcf26786862fed2e24ad8641603ac1
  schedule:
    # Refresh weekly so the moving component tags pick up updated base images/yt-dlp.
    - cron: '17 4 * * 1'
  push:
    branches: [main]
    paths:
      - .github/workflows/ts6-manager-coom.yml
      - images/ts6-manager-coom/**

permissions:
  contents: read
  packages: write

concurrency:
  group: ts6-manager-coom-images
  cancel-in-progress: false

env:
  FORK_REPOSITORY: coom/ts6-manager
  DEFAULT_FORK_REF: 09573b64cadcf26786862fed2e24ad8641603ac1
  IMAGE_NAME: ts6-manager-coom

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      fork_ref: ${{ steps.ref.outputs.fork_ref }}
      image: ${{ steps.image.outputs.image }}
    steps:
      - id: ref
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "fork_ref=${{ inputs.fork_ref }}" >> "$GITHUB_OUTPUT"
          else
            echo "fork_ref=${DEFAULT_FORK_REF}" >> "$GITHUB_OUTPUT"
          fi
      - id: image
        shell: bash
        run: |
          owner_lc="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          echo "image=ghcr.io/${owner_lc}/${IMAGE_NAME}" >> "$GITHUB_OUTPUT"

  build:
    needs: resolve
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: backend
            dockerfile: Dockerfile.backend
          - component: frontend
            dockerfile: Dockerfile.frontend
          - component: sidecar
            dockerfile: Dockerfile.sidecar
    steps:
      - name: Checkout coom fork
        shell: bash
        run: |
          git init .
          git remote add origin "https://github.com/${FORK_REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "${{ needs.resolve.outputs.fork_ref }}"
          git checkout --detach FETCH_HEAD

      - name: Resolve image tags
        id: meta
        shell: bash
        run: |
          sha="$(git rev-parse --short=12 HEAD)"
          date_tag="$(date -u +%Y%m%d)"
          ref_tag="$(printf '%s' '${{ needs.resolve.outputs.fork_ref }}' | tr '/:@ ' '----' | tr -cd 'A-Za-z0-9_.-')"
          {
            echo "sha=${sha}"
            echo "tags<<EOF"
            echo "${{ needs.resolve.outputs.image }}:${{ matrix.component }}-${sha}"
            echo "${{ needs.resolve.outputs.image }}:${{ matrix.component }}-${ref_tag}"
            echo "${{ needs.resolve.outputs.image }}:${{ matrix.component }}-${date_tag}"
            echo "${{ needs.resolve.outputs.image }}:${{ matrix.component }}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish ${{ matrix.component }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ env.FORK_REPOSITORY }}
            org.opencontainers.image.revision=${{ steps.meta.outputs.sha }}
            org.opencontainers.image.description=TS6 Manager ${{ matrix.component }} image built from coom/ts6-manager
